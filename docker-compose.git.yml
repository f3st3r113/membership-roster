# For Dockhand's "deploy from Git repository" stacks (compose file path: docker-compose.git.yml).
# Dockhand checks the repo out and builds the image from it, so no manual `docker build` is needed.
#
# Set these in the stack's Environment variables in Dockhand:
#     CFD_ADMIN_PASSWORD   password for the first "admin" login (only read on first start)
#     PUID / PGID          numeric owner of the data folder (run `id <user>` over SSH)
#     CFD_COOKIE_SECURE    1 once served over HTTPS (default 0)
services:
  roster:
    build: .
    image: cfd-roster:latest
    pull_policy: build            # rebuild from the checked-out code on every deploy
    container_name: cfd-roster
    restart: unless-stopped
    ports:
      - "8080:8000"               # change the left number if 8080 is taken
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # Absolute path outside the checkout, so a re-sync of the repo never touches the database.
      - /volume1/docker/cfd-roster/data:/data
    environment:
      CFD_ADMIN_USER: "admin"
      CFD_ADMIN_PASSWORD: "${CFD_ADMIN_PASSWORD:-}"
      CFD_COOKIE_SECURE: "${CFD_COOKIE_SECURE:-0}"
