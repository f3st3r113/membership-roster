# Cicero VFD Membership Roster - settings
#
# This file lives in the data folder (next to cfd.db) and is read automatically. Edits apply within a
# moment, no restart needed. A bad value is ignored (the built-in default is used) and a warning is
# written to the container log. Delete this file to get a fresh copy with the defaults.

# Shown in the page banner, browser tab titles and the sign-in page.
department_name: "Cicero Fire Department"

# Used on the printed/PDF roster and in contact cards (.vcf). Optional: defaults to department_name.
formal_name: "Cicero Volunteer Fire Department"

# Logo image (png, jpg, gif, svg or webp, under 2 MB). A plain file name is looked up in this same
# folder (the data folder). If it is missing, the built-in logo is used.
logo_file: logo.png

# Main color of the app: banner, buttons and links. Hex color, e.g. "#1d9a45".
# White text is drawn on it, so pick a medium or dark color. Dark mode adjusts it automatically.
theme_color: "#1d9a45"

# Color of the banner strip at the top of the printed roster (the PDF).
roster_banner_color: "#cbd4e4"

# Time zone used for "today" (roster date, interview forms). Names like America/New_York, America/Chicago, UTC.
timezone: "America/New_York"

# Membership groups, in the order shown. The number prefix controls sorting and is hidden on the
# printed roster ("01-Active Members" prints as "Active Members"). The first one is the default for
# new members. Members whose group is not listed here still appear; it just isn't offered for new entries.
groups:
  - "01-Active Members"
  - "02-Junior Members"
  - "03-In-Active Life Members"
  - "05-Fire Chiefs"
  - "06-Commissioners"
  - "07-Auxiliary Members"
  - "08-Honorary Members"
  - "09-Line of Duty Family"
  - "10-Hall Coordinator"

# Choices offered on the member form.
response_types:
  - "Normal"
  - "Duty Hours"

# The interview form has built-in requirements for these classes (Interior, Exterior, Junior, EMS, Driver,
# Fire Police, Associate). Add or rename classes only if you also adjust interview.py.
membership_classes:
  - "Interior"
  - "Exterior"
  - "Junior"
  - "EMS"
  - "Driver"
  - "Fire Police"
  - "Associate"

# Names printed with a check box along the bottom of the New Member Interview form (a blank box is always added).
interviewers:
  - "Scarano"
  - "Mayers"
  - "Hoffman"
  - "Carlin"
  - "Germain"
  - "Benjamin"

# Where "Create new member folder" puts the folders and interview PDFs:
#   auto        every place that is set up: the local folder (NEW_MEMBER_DIR) and/or SharePoint (below)
#   local       only the local folder
#   sharepoint  only SharePoint
#   both        local and SharePoint (a notice appears if either one is missing or fails)
storage: "auto"

# SharePoint (optional). Also needs SP_TENANT_ID, SP_CLIENT_ID and SP_CLIENT_SECRET in the stack
# (see the README). Files go to <library>/<sharepoint_folder>/<year>/<MM-Month>/<ID>_<Last>_<First>/.
sharepoint_site_url: "https://cicerofd.sharepoint.com/sites/MembershipCommittee"
sharepoint_library: "Documents"          # shows as "Shared Documents" in the web address
sharepoint_folder: "General"             # folder inside the library; use e.g. "General/TEST" while trying things out

# Optional: when a new member folder is made in SharePoint, COPY application files from this folder (inside the library)
# into the member's new folder. A file is copied when its name starts with Lastname_Firstname_ (like
# Cervantes_Evan_09-05-2026.pdf) and it was last modified within the number of days below. Originals stay put; a file
# with the same name already in the member's folder is replaced. Leave it empty to turn this off.
sharepoint_applications_folder: "General/_NewMemberApplications"
sharepoint_applications_days: 60
