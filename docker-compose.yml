services:
  roster:
    build: .
    container_name: cfd-roster
    restart: unless-stopped
    ports:
      - "8080:8000"            # change the left number if 8080 is taken
    # Run as the user that owns ./data (on Synology: your user's UID/GID, see README)
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data           # database + session key live here: back this folder up
    environment:
      # Only used the first time, when there are no users yet. Change it after logging in
      # (docker compose exec roster flask --app app set-password admin).
      CFD_ADMIN_USER: "admin"
      CFD_ADMIN_PASSWORD: "${CFD_ADMIN_PASSWORD:-}"
      # Set to 1 once the site is served over HTTPS (e.g. behind a reverse proxy)
      CFD_COOKIE_SECURE: "${CFD_COOKIE_SECURE:-0}"
